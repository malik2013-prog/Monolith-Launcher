name: Build & Sign Monolith Vanilla Launcher APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (stable / snapshot)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Assemble & Sign Vanilla Launcher (Ubuntu Latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-36" || sdkmanager "build-tools;34.0.0"

      - name: Setup Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Debug & Release Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"

          # 1. Ensure debug.keystore exists for debugConfig block in app/build.gradle.kts
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            if [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
              base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "android" \
                -keypass "android" \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure release keystore (my-upload-key.jks) exists
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MonolithLauncher, OU=Android, O=VanillaCore, L=Stockholm, S=SE, C=SE"
          fi

      - name: Build Release APK (Multi-Module)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export STORE_PASSWORD="${SECRET_STORE_PASS:-android}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-android}"
          export GEMINI_API_KEY="${SECRET_GEMINI_KEY:-CI_PLACEHOLDER_KEY}"

          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Verify & Align Signature via apksigner
        env:
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          FINAL_APK="app/build/outputs/apk/release/Monolith-Vanilla-Launcher-${GITHUB_REF_NAME}.apk"
          cp "$BUILT_APK" "$FINAL_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "${GITHUB_WORKSPACE}/my-upload-key.jks" \
            --ks-key-alias upload \
            --ks-pass "pass:${STORE_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            "$FINAL_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"
          echo "SIGNED_APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Optional Remote Mirror Sync via rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_CONTENT" ]; then
            sudo apt-get update && sudo apt-get install -y rclone
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
            rclone copy "$SIGNED_APK_PATH" "remote:monolith-launcher-builds/${GITHUB_REF_NAME}/" || true
          else
            echo "RCLONE_CONFIG secret is not set; skipping remote mirror sync."
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Vanilla-Launcher-APK
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}
          name: "Monolith Vanilla Launcher ${{ github.ref_name }}"
          body: |
            ### Monolith Vanilla Launcher (Android ARM64 / armeabi-v7a)
            - **PojavLauncher Core Bridge**: GL4ES 1.1.5, ANGLE (Vulkan) & VirGL Mesa
            - **Multi-Runtime OpenJDK**: Automatic routing for Java 8, Java 17, and Java 21
            - **Pure Vanilla Manifest V2**: Pre-Classic (rd-132211) through Latest Releases & Snapshots
            - **Built-in 2D/3D Skin Studio**: Mojang Official & Ely.by API + 64x64 Overlay Editor
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
