name: Build & Sign Monolith Vanilla Launcher APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (stable / snapshot)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Assemble & Sign Vanilla Launcher (Ubuntu Latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Wrapper & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -dname "CN=MonolithLauncher, OU=Android, O=VanillaCore, L=Stockholm, S=SE, C=SE"
          fi

      - name: Grant Execute Permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build Release APK (Multi-Module)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'CI_PLACEHOLDER_KEY' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify & Align Signature via apksigner
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_OR_REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          FINAL_APK="app/build/outputs/apk/release/Monolith-Vanilla-Launcher-${{ github.ref_name }}.apk"
          cp "$UNSIGNED_OR_REL_APK" "$FINAL_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "${GITHUB_WORKSPACE}/my-upload-key.jks" \
            --ks-key-alias upload \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            "$FINAL_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$FINAL_APK"
          echo "SIGNED_APK_PATH=$FINAL_APK" >> $GITHUB_ENV

      - name: Optional Remote Mirror Sync via rclone
        if: ${{ secrets.RCLONE_CONFIG != '' }}
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          rclone copy "$SIGNED_APK_PATH" remote:monolith-launcher-builds/${{ github.ref_name }}/ || true

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Vanilla-Launcher-APK
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}
          name: "Monolith Vanilla Launcher ${{ github.ref_name }}"
          body: |
            ### Monolith Vanilla Launcher (Android ARM64 / armeabi-v7a)
            - **PojavLauncher Core Bridge**: GL4ES 1.1.5, ANGLE (Vulkan) & VirGL Mesa
            - **Multi-Runtime OpenJDK**: Automatic routing for Java 8, Java 17, and Java 21
            - **Pure Vanilla Manifest V2**: Pre-Classic (rd-132211) through Latest Releases & Snapshots
            - **Built-in 2D/3D Skin Studio**: Mojang Official & Ely.by API + 64x64 Overlay Editor
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
