name: Build & Sign Monolith Vanilla Launcher APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (stable / snapshot)'
        required: false
        default: 'stable'

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Assemble & Sign Vanilla Launcher (Ubuntu Latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21 & Cache Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          fi

          mkdir -p "$SDK_DIR/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare Debug & Release Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"

          # 1. Restore or generate debug.keystore
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            if [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
              base64 --decode "${GITHUB_WORKSPACE}/debug.keystore.base64" > "${GITHUB_WORKSPACE}/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "android" \
                -keypass "android" \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Restore or generate my-upload-key.jks (alias: upload)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          else
            rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MonolithLauncher, OU=Android, O=VanillaCore, L=Stockholm, S=SE, C=SE"
          fi

      - name: Build Release APK (Multi-Module)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export STORE_PASSWORD="${SECRET_STORE_PASS:-android}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-android}"
          export GEMINI_API_KEY="${SECRET_GEMINI_KEY:-CI_PLACEHOLDER_KEY}"

          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify & Align Signature via apksigner
        env:
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${SECRET_STORE_PASS:-android}"
          KEY_PASS="${SECRET_KEY_PASS:-android}"

          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          FINAL_APK="app/build/outputs/apk/release/Monolith-Vanilla-Launcher-${GITHUB_REF_NAME}.apk"
          cp "$BUILT_APK" "$FINAL_APK"

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" sign \
              --ks "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              --ks-key-alias upload \
              --ks-pass "pass:${STORE_PASS}" \
              --key-pass "pass:${KEY_PASS}" \
              "$FINAL_APK"
            "$APKSIGNER_BIN" verify --verbose "$FINAL_APK"
          else
            keytool -printcert -jarfile "$FINAL_APK" > /dev/null
          fi

          echo "SIGNED_APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Optional Remote Mirror Sync via rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -n "$RCLONE_CONFIG_CONTENT" ]; then
            sudo apt-get update && sudo apt-get install -y rclone
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
            rclone copy "$SIGNED_APK_PATH" "remote:monolith-launcher-builds/${GITHUB_REF_NAME}/" || true
          else
            echo "RCLONE_CONFIG secret is not set; skipping remote mirror sync."
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monolith-Vanilla-Launcher-APK
          path: ${{ env.SIGNED_APK_PATH }}

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v1.0.0-${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG_NAME" "$SIGNED_APK_PATH" \
            --title "Monolith Vanilla Launcher $TAG_NAME" \
            --notes "Monolith Vanilla Launcher (Android ARM64 / armeabi-v7a) — PojavLauncher Core, OpenJDK 8/17/21, Mojang Manifest V2, 2D/3D Skin Studio & AI Diagnostics." || \
          gh release upload "$TAG_NAME" "$SIGNED_APK_PATH" --clobber
